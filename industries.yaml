# industries.yaml — industry taxonomy for the arXiv agent
#
# Source list: non-mainstream industries where China leads the US in production
# share, processing capacity, cost, or deployed scale. Compiled Sept 2026 from
# general knowledge. Shares are UNVERIFIED — treat this as a strategic label,
# not a citable figure. 108 industries, 78 of them eligible matches.
#
# SCOPE CHANGED 2026-09-30: this file used to describe "quantum technology ->
# industry". It now describes "experimental physical science -> industry". The
# quantum framing was silently excluding work that plainly matters here —
# perovskite solar cells, core-loss measurements on electrical steel, phonon
# transport in thermoelectrics, catalysts, electrolyser degradation. Three things
# changed together, and they only work together:
#   1. the secondary-category gate now asks "is there a measurement" rather than
#      "is this quantum" (see keyword_sets.experimental_evidence);
#   2. the tier definitions below no longer mention quantum;
#   3. eleven industries defined in purely quantum terms were redefined by what
#      they actually produce — `polysilicon` means solar and semiconductor
#      feedstock, not isotopically enriched qubit substrates.
# Changing the gate alone does nothing: papers reach triage and then score 0
# because no industry's DESCRIPTION covers them.
#
# Tiers
#   1 = match   : the materials/devices/processes studied ARE this industry's
#                 product or feedstock
#   2 = match   : the paper measures, monitors or improves this industry's
#                 process, product or infrastructure
#   3 = INERT   : not an eligible match and never sent to a model. 30 entries
#                 remain here — food, pharmaceutical formulation, agrochemicals
#                 and assembly-only manufacturing — because no physical-science
#                 paper is expected to bear on them. 38 former tier-3 entries
#                 were promoted on 2026-09-30 once the premise widened.
#
# Matching rules (implemented by the agent, not by this file)
#   - case-insensitive, word-boundary match on title + abstract
#   - an industry's effective keywords = its keywords + all keywords in its
#     keyword_sets + its group's keyword_sets
#   - a hit on a group-level keyword_set with no industry-specific hit tags
#     the GROUP (e.g. "critical minerals") rather than every member

version: 1

# Tier definitions, sent verbatim to the scoring model. Kept here rather than in
# the prompt so this file stays the single source of truth.
tiers:
  1: "The materials, devices, or fabrication steps studied in the paper are what this industry produces or refines."
  2: "The paper measures, monitors, or improves this industry's process, product, or deployed infrastructure."
  3: "Not an eligible match. Retained but inert -- no physical-science paper is expected to bear on these (food, pharmaceutical formulation, agrochemicals, assembly-only manufacturing)."

arxiv:
  primary: [quant-ph]
  # Allowlisted cond-mat and physics subcategories. cond-mat and physics are far
  # too large to take whole, and most of each is irrelevant here, so the scope is
  # an explicit allowlist rather than an archive with exclusions.
  #
  # Measured 7-day submission volume (2026-09-15 -> 2026-09-22), and the papers
  # each category uniquely adds to the deduped union:
  #
  #   quant-ph             467   (+372 unique)
  #   cond-mat.mtrl-sci    205   (+129)
  #   physics.optics       119   ( +79)
  #   cond-mat.str-el      109   ( +46)
  #   cond-mat.mes-hall    105   ( +39)
  #   physics.ins-det       37   ( +27)
  #   physics.app-ph        55   ( +23)
  #   physics.atom-ph       39   ( +21)
  #   cond-mat.supr-con     52   ( +20)
  #   ---------------------------------------
  #   deduped union        955 papers/week
  #
  # Deliberately excluded as theory-heavy or off-topic, with their volume, to
  # record that the choice was measured rather than assumed:
  #   cond-mat.stat-mech 139, physics.chem-ph 73, cond-mat.soft 57,
  #   physics.plasm-ph 48, cond-mat.dis-nn 32, cond-mat.quant-gas 30,
  #   cond-mat.other 23, physics.acc-ph 16, physics.hist-ph 8
  secondary: [cond-mat.mtrl-sci, cond-mat.supr-con, cond-mat.mes-hall,
              cond-mat.str-el, physics.app-ph, physics.optics,
              physics.ins-det, physics.atom-ph]
  # Papers from secondary categories are kept only if title/abstract also hits at
  # least one term in this keyword set. See `experimental_evidence` below for why
  # this is no longer `quantum_core`.
  #
  # NOTE: widening this gate does NOT retroactively reconsider papers it already
  # rejected -- they are stored with gate_passed = 0 so dedupe skips them forever.
  # After changing it, run:  DELETE FROM papers WHERE gate_passed = 0;
  secondary_requires: experimental_evidence

domains: [manufacturing, aerospace, quantum_hardware]

# Keywords matched case-sensitively, overriding the default case-insensitive rule.
# These are chemical formulae that collide with ordinary English words once
# lowercased. Empty this list to restore fully case-insensitive matching.
#   GaP -> "gap"  (band gap, energy gap, spectral gap: fired on 7.8% of papers)
#   TiN -> "tin"
#   TES -> "tes"
case_sensitive: [GaP, TiN, TES]

# Phrases in which a keyword should NOT count as a hit. Word-boundary matching
# cannot tell "roller bearing" from "bearing in mind"; this can.
exclusions:
  bearing:
    ["bearing in mind", "bearings in mind", "bearing on", "bearing this in mind"]

keyword_sets:
  quantum_core:
    [qubit, quantum, entanglement, entangled, NV center, nitrogen-vacancy,
     atom interferometer, atom interferometry, squeezed light, single-photon,
     superconducting, spin qubit, optically pumped magnetometer, Rydberg,
     cold atoms, trapped ion, quantum dot, color center]
  # The gate on secondary-category papers. Replaced `quantum_core` in that role on
  # 2026-09-30: requiring a quantum mention discarded 75% of cond-mat/physics
  # papers, including perovskite solar cells, core-loss measurements on electrical
  # steel, phonon transport in thermoelectric clathrates and fibre-optic pulse
  # propagation -- all squarely relevant to industries in this file. The gate now
  # asks "is there a real measurement here" instead of "is this quantum".
  #
  # Measured on 878 secondary-only papers: quantum_core kept 25%, this keeps 42%.
  experimental_evidence:
    [we demonstrate, we measure, we report, we observe, we present, we show,
     we fabricate, fabricated, fabrication, experimentally, measured, measurement,
     characterized, characterised, synthesized, synthesised, deposited, grown,
     annealed, device, sample, prototype, testbed, observed, prepared,
     we achieve, we obtain, we find]
  superconducting_materials:
    [critical current, critical current density, Jc, upper critical field, Hc2,
     irreversibility field, flux pinning, superconducting tape, coated conductor,
     REBCO, YBCO, BSCCO, Nb3Sn, NbTi, niobium titanium, niobium tin,
     superconducting wire, superconducting magnet, transition temperature, Tc,
     Meissner, high-temperature superconductor, thin film superconductor]
  mineral_exploration:
    [quantum gravimeter, gravity gradiometer, gravity gradiometry,
     mineral exploration, geophysical survey, airborne magnetometry,
     ore body, magnetic anomaly]
  subsurface:
    [quantum gravimeter, gravity gradiometry, subsurface void,
     underground mapping, tunnel detection, near-surface geophysics]
  grid_sensing:
    [diamond magnetometer, NV current sensor, current sensing, power grid,
     transformer, electrical steel, magnetic domain imaging, busbar,
     fault detection, high-voltage]
  battery_sensing:
    [quantum diamond microscope, NV magnetometry, lithium plating,
     operando, battery, magnetic susceptibility imaging, cathode, anode,
     electrolyte, lithium-ion]
  ndt:
    [non-destructive testing, nondestructive testing, NDT, NDE,
     atomic magnetometer, optically pumped magnetometer, eddy current,
     crack detection, weld inspection, defect imaging, corrosion detection]
  inertial:
    [quantum inertial sensor, atom interferometer gyroscope,
     quantum accelerometer, quantum gyroscope, cold-atom navigation,
     inertial navigation, PNT, GNSS-denied]

groups:
  critical_minerals:  {name: "Critical minerals & processing", keyword_sets: [mineral_exploration]}
  chemicals:          {name: "Specialty & bulk chemicals"}
  pharma_medical:     {name: "Pharmaceutical & medical inputs"}
  power_grid:         {name: "Power & grid hardware", keyword_sets: [grid_sensing]}
  battery_chain:      {name: "Battery supply chain", keyword_sets: [battery_sensing]}
  industrial:         {name: "Industrial components & machinery", keyword_sets: [ndt]}
  electronics:        {name: "Electronics components"}
  heavy_materials:    {name: "Heavy materials & construction"}
  food_textiles:      {name: "Food, textiles & other"}

